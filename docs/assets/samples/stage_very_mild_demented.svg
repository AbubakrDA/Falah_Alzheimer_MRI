<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#121824"/>
      <stop offset="100%" stop-color="#080b10"/>
    </radialGradient>
    <radialGradient id="parenchymaVeryMild" cx="50%" cy="48%" r="46%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="65%" stop-color="#475569"/>
      <stop offset="90%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="ventricleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05070a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="mriBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="480" rx="16" fill="url(#bgGlow)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Header Badge -->
  <rect x="20" y="20" width="170" height="26" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="30" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">CDR 0.5 • VERY MILD</text>

  <rect x="270" y="20" width="110" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="282" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">TRAIN / TEST</text>

  <!-- Title & Subtitle -->
  <text x="20" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#f8fafc">Very Mild Impairment</text>
  <text x="20" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">Questionable Dementia • Early Medial Temporal Atrophy</text>

  <!-- MRI Scan Display Window -->
  <g transform="translate(40, 105)">
    <!-- Outer Calvarium -->
    <ellipse cx="160" cy="155" rx="138" ry="152" fill="#1e293b" stroke="#64748b" stroke-width="3" opacity="0.6"/>
    <ellipse cx="160" cy="155" rx="134" ry="148" fill="#090d16" stroke="#334155" stroke-width="1.5"/>

    <!-- Brain Parenchyma -->
    <path d="M 160,20 
             C 228,20 282,76 282,155 
             C 282,228 228,283 160,283 
             C 92,283 38,228 38,155 
             C 38,76 92,20 160,20 Z" 
          fill="url(#parenchymaVeryMild)" filter="url(#mriBlur)"/>

    <!-- Mildly widened sulcal spaces in parietal/temporal margins -->
    <path d="M 58,125 Q 92,138 112,118 M 262,125 Q 228,138 208,118 
             M 68,185 Q 102,172 122,192 M 252,185 Q 218,172 198,192
             M 160,35 L 160,85 M 160,225 L 160,275" 
          stroke="#1e293b" stroke-width="3.2" fill="none" opacity="0.75"/>

    <!-- Interhemispheric Fissure -->
    <line x1="160" y1="25" x2="160" y2="280" stroke="#05070a" stroke-width="2.8" opacity="0.8"/>

    <!-- Slightly Widened Lateral Ventricles -->
    <!-- Left Ventricle -->
    <path d="M 150,105 C 146,128 132,155 137,178 C 143,190 152,180 154,155 C 155,132 155,112 150,105 Z" 
          fill="url(#ventricleGrad)" stroke="#020617" stroke-width="1.8"/>
    <!-- Right Ventricle -->
    <path d="M 170,105 C 174,128 188,155 183,178 C 177,190 168,180 166,155 C 165,132 165,112 170,105 Z" 
          fill="url(#ventricleGrad)" stroke="#020617" stroke-width="1.8"/>

    <!-- Third Ventricle (Slightly dilated) -->
    <line x1="160" y1="142" x2="160" y2="178" stroke="#020617" stroke-width="3.2"/>

    <!-- Early Hippocampal Sulcus Widening & Mild Volume Decrease -->
    <ellipse cx="120" cy="195" rx="12" ry="8" fill="#475569" opacity="0.85"/>
    <ellipse cx="200" cy="195" rx="12" ry="8" fill="#475569" opacity="0.85"/>
    <!-- Fissure CSF rim -->
    <path d="M 108,195 Q 120,205 132,195" stroke="#020617" stroke-width="2.0" fill="none"/>
    <path d="M 188,195 Q 200,205 212,195" stroke="#020617" stroke-width="2.0" fill="none"/>
    
    <!-- Orientation Markers -->
    <text x="156" y="14" font-family="monospace" font-size="11" font-weight="700" fill="#64748b">A</text>
    <text x="156" y="300" font-family="monospace" font-size="11" font-weight="700" fill="#64748b">P</text>
    <text x="18" y="158" font-family="monospace" font-size="11" font-weight="700" fill="#64748b">R</text>
    <text x="296" y="158" font-family="monospace" font-size="11" font-weight="700" fill="#64748b">L</text>
  </g>

  <!-- Clinical Annotations Footer -->
  <rect x="20" y="415" width="360" height="50" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="36" cy="433" r="5" fill="#38bdf8"/>
  <text x="50" y="437" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Ventricles: Subtle enlargement of frontal/temporal horns</text>
  <circle cx="36" cy="451" r="5" fill="#38bdf8"/>
  <text x="50" y="455" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Hippocampus: Early widening of choroid fissure</text>
</svg>

