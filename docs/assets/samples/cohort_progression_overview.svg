<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.4"/>
    </filter>
    <filter id="glowYellow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ef4444" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Banner Background -->
  <rect width="1100" height="320" rx="14" fill="url(#bgBanner)" stroke="#1e293b" stroke-width="2"/>

  <!-- Top Title Header -->
  <text x="30" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#f8fafc">NeuroVision 2.0 • Alzheimer's Disease Cognitive Impairment Progression Spectrum</text>
  <text x="30" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">Cross-Cohort Staging &amp; Morphological Hallmarks (Falah 2D Axial Slices &amp; OASIS-1 Volumetric Scans)</text>

  <!-- Stage 1: Non-Demented -->
  <g transform="translate(30, 85)">
    <rect width="240" height="205" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.8" filter="url(#glowGreen)"/>
    <rect x="12" y="12" width="105" height="22" rx="4" fill="#065f46" fill-opacity="0.5"/>
    <text x="18" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">CDR 0.0 • NORMAL</text>
    <text x="12" y="55" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#f8fafc">Non-Demented</text>
    <!-- Slice icon preview -->
    <ellipse cx="60" cy="115" rx="38" ry="42" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <path d="M 57,105 Q 55,115 57,125 M 63,105 Q 65,115 63,125" stroke="#090d16" stroke-width="2" fill="none"/>
    <circle cx="50" cy="126" r="3" fill="#64748b"/>
    <circle cx="70" cy="126" r="3" fill="#64748b"/>
    <!-- Bullet details -->
    <text x="110" y="98" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">• Ventricles: Slender</text>
    <text x="110" y="116" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Hippocampus: Full</text>
    <text x="110" y="134" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Sulci: Narrow/Intact</text>
    <!-- Split Counts -->
    <rect x="12" y="170" width="216" height="24" rx="4" fill="#1e293b"/>
    <text x="20" y="186" font-family="monospace" font-size="11" fill="#cbd5e1">Train: 2,560 | Test: 640</text>
  </g>

  <!-- Flow Arrow 1 -->
  <path d="M 280,185 L 295,185 M 290,180 L 297,185 L 290,190" stroke="#475569" stroke-width="2.5" fill="none"/>

  <!-- Stage 2: Very Mild -->
  <g transform="translate(305, 85)">
    <rect width="240" height="205" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" filter="url(#glowBlue)"/>
    <rect x="12" y="12" width="125" height="22" rx="4" fill="#0369a1" fill-opacity="0.4"/>
    <text x="18" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">CDR 0.5 • VERY MILD</text>
    <text x="12" y="55" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#f8fafc">Very Mild Demented</text>
    <!-- Slice icon preview -->
    <ellipse cx="60" cy="115" rx="38" ry="42" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <path d="M 56,103 Q 52,115 56,127 M 64,103 Q 68,115 64,127" stroke="#090d16" stroke-width="2.6" fill="none"/>
    <circle cx="50" cy="126" r="2.5" fill="#475569"/>
    <circle cx="70" cy="126" r="2.5" fill="#475569"/>
    <!-- Bullet details -->
    <text x="110" y="98" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">• Ventricles: +5% size</text>
    <text x="110" y="116" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Fissures: Widening</text>
    <text x="110" y="134" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Sulci: Early gaps</text>
    <!-- Split Counts -->
    <rect x="12" y="170" width="216" height="24" rx="4" fill="#1e293b"/>
    <text x="20" y="186" font-family="monospace" font-size="11" fill="#cbd5e1">Train: 1,792 | Test: 448</text>
  </g>

  <!-- Flow Arrow 2 -->
  <path d="M 555,185 L 570,185 M 565,180 L 572,185 L 565,190" stroke="#475569" stroke-width="2.5" fill="none"/>

  <!-- Stage 3: Mild Demented -->
  <g transform="translate(580, 85)">
    <rect width="240" height="205" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.8" filter="url(#glowYellow)"/>
    <rect x="12" y="12" width="105" height="22" rx="4" fill="#b45309" fill-opacity="0.4"/>
    <text x="18" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">CDR 1.0 • MILD</text>
    <text x="12" y="55" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#f8fafc">Mild Demented</text>
    <!-- Slice icon preview -->
    <ellipse cx="60" cy="115" rx="36" ry="40" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <path d="M 55,100 Q 48,115 55,130 M 65,100 Q 72,115 65,130" stroke="#090d16" stroke-width="3.6" fill="none"/>
    <circle cx="50" cy="126" r="2" fill="#334155"/>
    <circle cx="70" cy="126" r="2" fill="#334155"/>
    <!-- Bullet details -->
    <text x="110" y="98" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">• Ventricles: Dilated</text>
    <text x="110" y="116" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Hippocampus: -35%</text>
    <text x="110" y="134" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Sulci: Noticeable</text>
    <!-- Split Counts -->
    <rect x="12" y="170" width="216" height="24" rx="4" fill="#1e293b"/>
    <text x="20" y="186" font-family="monospace" font-size="11" fill="#cbd5e1">Train: 717 | Test: 179</text>
  </g>

  <!-- Flow Arrow 3 -->
  <path d="M 830,185 L 845,185 M 840,180 L 847,185 L 840,190" stroke="#475569" stroke-width="2.5" fill="none"/>

  <!-- Stage 4: Moderate Demented -->
  <g transform="translate(855, 85)">
    <rect width="215" height="205" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="1.8" filter="url(#glowRed)"/>
    <rect x="12" y="12" width="140" height="22" rx="4" fill="#991b1b" fill-opacity="0.4"/>
    <text x="18" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f87171">CDR 2.0 • MODERATE</text>
    <text x="12" y="55" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#f8fafc">Moderate Demented</text>
    <!-- Slice icon preview -->
    <ellipse cx="50" cy="115" rx="34" ry="38" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <path d="M 45,95 Q 35,115 45,135 M 55,95 Q 65,115 55,135" stroke="#020617" stroke-width="5.0" fill="none"/>
    <circle cx="42" cy="126" r="1.5" fill="#1e293b"/>
    <circle cx="58" cy="126" r="1.5" fill="#1e293b"/>
    <!-- Bullet details -->
    <text x="95" y="98" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">• Hydrocephalus</text>
    <text x="95" y="116" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Atrophy: >60%</text>
    <text x="95" y="134" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Sulci: Gaping</text>
    <!-- Split Counts -->
    <rect x="12" y="170" width="191" height="24" rx="4" fill="#1e293b"/>
    <text x="18" y="186" font-family="monospace" font-size="11" fill="#cbd5e1">Train: 51 | Test: 13 (1%)</text>
  </g>
</svg>
